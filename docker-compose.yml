# ── La Ruche — Docker Compose ────────────────────────────────────
# Usage dev    : docker compose up --build
# Usage prod   : docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# The unified image (root Dockerfile) includes frontend (Vue) + backend (Rust) + Caddy.
# Services :
#   laruche   — unified image (Caddy + backend, frontend)
#   postgres  — database
#   rustfs    — S3 compatible storage (self-hosted)

services:

  laruche:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    environment:
      LA_RUCHE__APP__DEMO_MODE: "true"
      LA_RUCHE__APP__HOST: "0.0.0.0"
      LA_RUCHE__APP__PORT: "8080"
      LA_RUCHE__APP__PUBLIC_URL: "${PUBLIC_URL:-http://localhost}"
      LA_RUCHE__APP__NAME: "La Ruche"
      LA_RUCHE__DB__URL: "postgres://laruche:${POSTGRES_PASSWORD:-laruche}@postgres:5432/laruche"
      LA_RUCHE__DB__MAX_CONNECTIONS: "20"
      LA_RUCHE__S3__ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://rustfs:9000}"
      LA_RUCHE__S3__PUBLIC_URL: "${S3_PUBLIC_URL:-http://localhost:9000}"
      LA_RUCHE__S3__REGION: "${S3_REGION:-us-east-1}"
      LA_RUCHE__S3__ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-s3admin}"
      LA_RUCHE__S3__SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-s3admin}"
      LA_RUCHE__S3__BUCKET_PREFIX: "laruche"
      LA_RUCHE__S3__STAGING_BUCKET: "laruche-staging"
      LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
      LA_RUCHE__AUTH__JWT_SECRET: "${JWT_SECRET:-dc9f8b9a355c625b1fab83b4afd73dfcc81831a6420cbb5c2f7c93ad9bac714ff0aa736ac3cb79cfb7a593a6bbde40bd958c8d807223687b5f7393c5036380bc}"
      LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
      LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
      LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
      LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
      LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "90"
      LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
      LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
      RUST_BACKTRACE: "${RUST_BACKTRACE:-1}"
      RUST_LOG: "${RUST_LOG:-laruche=debug,tower_http=info}"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laruche
      POSTGRES_USER: laruche
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-laruche}"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laruche"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: # dev only
      - "5432:5432"

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY_ID:-s3admin}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:-s3admin}"
    # volumes:
    #   - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: # dev only
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web RustFS (dev only)

volumes:
  postgres_data:
  rustfs_data:
