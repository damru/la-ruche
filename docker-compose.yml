# ── La Ruche — Docker Compose ────────────────────────────────────
# Usage dev    : docker compose up --build
# Usage prod   : docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# The unified image (root Dockerfile) includes frontend (Vue) + backend (Rust) + Caddy.
# Services :
#   laruche   — unified image (Caddy + backend, frontend)
#   postgres  — database
#   minio     — S3 compatible storage (self-hosted)

services:

  laruche:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LA_RUCHE__APP__HOST: "0.0.0.0"
      LA_RUCHE__APP__PORT: "8080"
      LA_RUCHE__APP__PUBLIC_URL: "${PUBLIC_URL:-http://localhost}"
      LA_RUCHE__APP__NAME: "La Ruche"
      LA_RUCHE__DB__URL: "postgres://laruche:${POSTGRES_PASSWORD:-laruche}@postgres:5432/laruche"
      LA_RUCHE__DB__MAX_CONNECTIONS: "20"
      LA_RUCHE__S3__ENDPOINT_URL: "${S3_ENDPOINT_URL:-http://minio:9000}"
      LA_RUCHE__S3__REGION: "${S3_REGION:-us-east-1}"
      LA_RUCHE__S3__ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-minioadmin}"
      LA_RUCHE__S3__SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-minioadmin}"
      LA_RUCHE__S3__BUCKET_PREFIX: "laruche"
      LA_RUCHE__S3__STAGING_BUCKET: "laruche-staging"
      LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
      LA_RUCHE__AUTH__JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
      LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
      LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
      LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
      LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
      LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
      LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
      RUST_BACKTRACE: "${RUST_BACKTRACE:-1}"
      RUST_LOG: "${RUST_LOG:-laruche=debug,tower_http=info}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: laruche
      POSTGRES_USER: laruche
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-laruche}"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laruche"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: # dev only
      - "5432:5432"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY:-minioadmin}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: # dev only
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web MinIO (dev only)

volumes:
  postgres_data:
  minio_data:
