  <!-- légende -->
  <g transform="translate(20,546)">
    <text x="0" y="0" font-size="6.4" fill="#6b7280">Échantillon v7.1 du rendu serveur : logo web exact (dégradé figé par alvéole, identique au PNG backend), « La Ruche » en Fraunces Bold et « Gestion participative » en DM Sans, en-têtes émetteur/destinataire alignés sur la même ligne, corps de lettre justifié, destinataire = l’utilisateur qui a demandé le document. Implémentation genpdf : justification via élément custom (0.2.0 ne la supporte pas nativement), polices embarquées via include_bytes.</text>
