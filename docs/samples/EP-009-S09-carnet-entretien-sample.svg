    <rect x="0" y="0" width="300" height="4" fill="#643fd5"/>

    <!-- Bloc marque : logo web inline + Fraunces + DM Sans -->
    <g transform="translate(24,16) scale(0.3448)">
      <polygon fill="#704de2" points="51.5,40 45.75,49.96 34.25,49.96 28.5,40 34.25,30.04 45.75,30.04"/>
