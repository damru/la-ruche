
<!-- Echantillon schematic v7.1 : polices Fraunces / DM Sans non embarquees.
     Les TTF sont dans backend/assets/fonts ; ouvrez ce SVG avec ces polices
     installees pour un rendu typographique fidele du PDF genere. -->

