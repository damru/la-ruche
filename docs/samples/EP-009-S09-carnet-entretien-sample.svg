    <!-- Double en-tête : émetteur et destinataire alignés sur la même ligne -->
    <text x="24" y="72" font-size="5.6" fill="#111827" font-weight="bold">Le syndic des copropriétaires</text>
    <text x="24" y="80" font-size="5.6" fill="#6b7280">Damien Rubio — 12 rue des Acacias</text>
    <text x="24" y="88" font-size="5.6" fill="#6b7280">44000 Nantes</text>
    <text x="24" y="96" font-size="5.6" fill="#6b7280">SIRET : 812 345 678 00025</text>
    <text x="276" y="72" font-size="5.6" fill="#6b7280" text-anchor="end" font-weight="bold">Destinataire</text>
    <text x="276" y="80" font-size="5.6" fill="#111827" text-anchor="end">Marie Dupont — Copropriétaire</text>
    <text x="276" y="88" font-size="5.6" fill="#6b7280" text-anchor="end">Lot 12 — 41 rue Alain Barbe Torte</text>
