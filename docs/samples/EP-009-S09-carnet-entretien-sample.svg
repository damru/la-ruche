    <text x="0" y="12" font-size="6.4" fill="#6b7280">Bloc marque web (logo inline + Fraunces Bold #191c1d + DM Sans « Gestion</text>
    <text x="0" y="21" font-size="6.4" fill="#6b7280">participative »). Émetteur et Destinataire alignés sur la même ligne. Corps</text>
    <text x="0" y="30" font-size="6.4" fill="#6b7280">justifié. Destinataire = l&#39;utilisateur qui a demandé le document.</text>
  </g>

