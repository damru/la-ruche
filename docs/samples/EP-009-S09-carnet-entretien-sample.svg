  <text x="20" y="24" font-size="15" fill="#111827" font-weight="bold">EP-009-S09 — Carnet d’entretien : échantillon du rendu « lettre + annexe » (template documentaire v7.1)</text>

  <!-- ══════════════ PAGE 1 : LETTRE ══════════════ -->
  <g transform="translate(20,44)">
