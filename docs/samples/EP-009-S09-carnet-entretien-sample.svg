    <line x1="24" y1="104" x2="276" y2="104" stroke="#643fd5" stroke-width="1.2"/>

    <!-- Corps de lettre — justifié -->
    <text x="24" y="122" font-size="6.4" fill="#111827" font-weight="bold">Objet : Carnet d&#39;entretien de l&#39;immeuble — édition 2026</text>
    <text x="24" y="132" font-size="5.6" fill="#6b7280">Réf. LR-CARNET-2026-102 — destinataire : Marie Dupont (demandeuse)</text>

    <text x="24" y="152" font-size="6" fill="#111827">Madame, Monsieur,</text>

    <text x="24" y="170" font-size="6" fill="#111827" textLength="252" lengthAdjust="spacing">Conformément au décret n°2001-477 et à l&#39;article 1er de la loi SRU, le syndic tient à jour le carnet</text>
    <text x="24" y="179" font-size="6" fill="#111827" textLength="252" lengthAdjust="spacing">d&#39;entretien de l&#39;immeuble. Vous trouverez ci-joint, en annexe du présent document, l&#39;édition du</text>
    <text x="24" y="188" font-size="6" fill="#111827" textLength="252" lengthAdjust="spacing">carnet au 27 octobre 2026 : contrats d&#39;assurance et de maintenance en cours, puis chronologie</text>
    <text x="24" y="197" font-size="6" fill="#111827">complète des interventions.</text>
    <text x="24" y="216" font-size="6" fill="#111827" textLength="252" lengthAdjust="spacing">Cette édition est valable à sa date d&#39;émission et remplace toute édition antérieure. Elle peut être</text>
    <text x="24" y="225" font-size="6" fill="#111827">consultée par tout copropriétaire sur simple demande auprès du syndic.</text>
    <text x="24" y="252" font-size="6" fill="#111827">Nous restons à votre disposition pour toute question relative au contenu de ce document.</text>
    <text x="24" y="276" font-size="6" fill="#111827">Je vous prie d&#39;agréer, Madame, Monsieur, l&#39;expression de mes salutations distinguées.</text>

    <!-- Signature alignée à droite -->
    <text x="276" y="330" font-size="6.2" fill="#111827" text-anchor="end">Pour le syndic,</text>
    <text x="276" y="356" font-size="7.5" fill="#111827" text-anchor="end" font-weight="bold">Damien Rubio</text>
    <text x="276" y="366" font-size="5.6" fill="#6b7280" text-anchor="end">Syndic en exercice — Résidence Les Tilleuls</text>
    <text x="276" y="378" font-size="6" fill="#111827" text-anchor="end">Fait à Nantes, le 27 octobre 2026</text>

    <!-- Footer -->
