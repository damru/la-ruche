name: Visual preview

# Phase 3 — before/after screen comparison inside the PR review.
#
# Captures every stable layout page (2 viewports x light/dark) and commits
# changed PNGs to the PR branch (`frontend/e2e/visual/`), so image diffs
# appear natively in the PR Files Changed tab (GitHub Swipe view).
# No threshold, no external report: the PR review IS the gate. On merge,
# main inherits the new references — no baseline ceremony.
#
# Never blocking by design; fails only if the app itself breaks at capture
# time. Captures run on CI x86 ONLY (Pi ARM64 renders fonts/GPU differently).

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/visual-preview.yml'
    # Known limitation: a backend-only PR (seed dates, API shape) does not
    # refresh the references here — they update on the next frontend PR.

concurrency:
  group: "visual-preview-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_CLI_VERSION: 0.8.6

jobs:
  capture:
    name: Captures — pages x viewports x themes
    # Anti-loop: the bot push (GITHUB_TOKEN) makes github.actor the
    # github-actions bot — skip the run its own commit triggers. A manual
    # re-run by a human keeps actor = human and runs normally.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: laruche
          POSTGRES_USER: laruche
          POSTGRES_PASSWORD: laruche
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Backend env (AppConfig has no serde defaults — cf. backend/src/config.rs).
      # S3 is read-only for capture pages; no rustfs service needed.
      LA_RUCHE__DB__URL: postgres://laruche:laruche@localhost:5432/laruche
      LA_RUCHE__DB__MAX_CONNECTIONS: "5"
      LA_RUCHE__APP__DEMO_MODE: "true"
      LA_RUCHE__APP__HOST: "0.0.0.0"
      LA_RUCHE__APP__PORT: "8080"
      LA_RUCHE__APP__PUBLIC_URL: "http://localhost"
      LA_RUCHE__APP__NAME: "La Ruche CI"
      LA_RUCHE__AUTH__JWT_SECRET: "e2e-only-secret-not-used-in-production-0123456789abcdef"
      LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
      LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
      LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
      LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
      LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
      LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
      LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
      LA_RUCHE__S3__ENDPOINT_URL: "http://localhost:9000"
      LA_RUCHE__S3__PUBLIC_URL: "http://localhost:9000"
      LA_RUCHE__S3__REGION: "us-east-1"
      LA_RUCHE__S3__ACCESS_KEY_ID: "s3admin"
      LA_RUCHE__S3__SECRET_ACCESS_KEY: "s3admin"
      LA_RUCHE__S3__BUCKET_PREFIX: "laruche-ci"
      LA_RUCHE__S3__STAGING_BUCKET: "laruche-staging"
      LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
      LA_RUCHE__S3__CLEANUP_ENABLED: "false"
    steps:
      # Same-repo PRs only: we must push to the PR branch, impossible for
      # forks with GITHUB_TOKEN (mechanism disabled there, cf. plan).
      - uses: actions/checkout@v7
        with:
          # pull_request checks out the merge ref detached by default — a
          # bare `git push` would fail on a detached HEAD.
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: backend-ci
          workspaces: |
            backend -> target

      - name: Cache sqlx-cli binary
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-${{ runner.os }}-${{ env.SQLX_CLI_VERSION }}-v2

      - name: Install sqlx-cli
        working-directory: ./backend
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            echo "Installing sqlx-cli (not restored from cache)"
            cargo install sqlx-cli --version ${{ env.SQLX_CLI_VERSION }} --no-default-features --features postgres --locked
          fi

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche
        run: sqlx migrate run

      - name: Generate SQLx offline files
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche
        run: cargo sqlx prepare

      - name: Build backend (release, SQLx offline)
        working-directory: ./backend
        env:
          SQLX_OFFLINE: true
        run: cargo build --release

      - name: Pre-seed demo database (anchor NOW()/CURRENT_DATE)
        # The demo seed is relative to now(): re-seeding per run would change
        # every displayed date/time between runs (churny bot commits). Anchor
        # NOW()/CURRENT_DATE to the capture clock — read from
        # frontend/e2e/helpers-visual.ts (FIXED_NOW_ISO), the single source
        # of truth; the backend then skips its own seed (DB non-empty).
        working-directory: ./backend
        env:
          PGPASSWORD: laruche
        run: |
          ANCHOR_TS=$(sed -n "s/^export const FIXED_NOW_ISO = '\\([^']*\\)'/\\1/p" ../frontend/e2e/helpers-visual.ts)
          test -n "$ANCHOR_TS" || { echo "FIXED_NOW_ISO not found in helpers-visual.ts"; exit 1; }
          sed -e "s/NOW()/'${ANCHOR_TS}'::timestamptz/g" \
              -e "s/CURRENT_DATE/'${ANCHOR_TS%% *}'::date/g" \
              seeds/demo.sql \
            | psql -h localhost -U laruche -d laruche -v ON_ERROR_STOP=1 -qf -

      - name: Start backend (migrations + seed demo at boot)
        working-directory: ./backend
        run: |
          nohup ./target/release/laruche > /tmp/laruche-visual.log 2>&1 &
          echo $! > /tmp/laruche-visual.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "Backend ready (HTTP $code)"; exit 0
            fi
            sleep 2
          done
          echo "--- backend log ---"; tail -50 /tmp/laruche-visual.log
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Capture pages
        env:
          CI: "true"
        run: npx playwright test --project=visual

      - name: Discard captures below the noise threshold
        # Residual rendering jitter (pixelmatch-measured: 81-562 px, visually
        # invisible) still differs byte-to-byte between CI runs. Keep a
        # capture only if its pixelmatch mismatch (AA-aware) exceeds 1000 px —
        # real content changes sit far above that.
        working-directory: ./frontend
        run: node e2e/scripts/discard-noise.mjs

      - name: Commit & push changed captures
        # continue-on-error: a push race (new commit landed mid-capture) or a
        # fork PR must not turn the run red — the next synchronize event
        # recaptures and retries. The PR image diff is the deliverable, not
        # this step's exit code.
        continue-on-error: true
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f: e2e/visual/ is git-ignored so local (ARM64) runs never commit
          # captures; only this x86 job force-adds them.
          git add -f frontend/e2e/visual
          if git diff --cached --quiet; then
            echo "No visual changes — nothing to commit"
          else
            git commit -m "chore(visual): regenerate captures"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
