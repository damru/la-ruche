name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Tests backend ──────────────────────────────────────────────
  test-backend:
    name: Backend — test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: laruche_test
          POSTGRES_USER: laruche
          POSTGRES_PASSWORD: laruche
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/backend/.cargo/bin/
            ~/backend/.cargo/registry/
            ~/backend/.cargo/git/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres --locked

      - name: Run migrations
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
        run: sqlx migrate run

      - name: Generate SQLx offline files
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
        run: cargo sqlx prepare

      - name: Check formatting
        env:
          SQLX_OFFLINE: true
        run: cargo fmt --check

      - name: Clippy
        env:
          SQLX_OFFLINE: true
        run: cargo clippy -- -D warnings

      - name: Tests unitaires (sans DB)
        env:
          SQLX_OFFLINE: true
        run: cargo test --lib

      - name: Tests d'intégration (avec DB)
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__APP__HOST: 127.0.0.1
          LA_RUCHE__APP__PORT: "8080"
          LA_RUCHE__APP__PUBLIC_URL: http://localhost
          LA_RUCHE__APP__NAME: La Ruche CI
          LA_RUCHE__DB__URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__DB__MAX_CONNECTIONS: "5"
          LA_RUCHE__S3__ENDPOINT_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__PUBLIC_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__REGION: us-east-1
          LA_RUCHE__S3__ACCESS_KEY_ID: minioadmin
          LA_RUCHE__S3__SECRET_ACCESS_KEY: minioadmin
          LA_RUCHE__S3__BUCKET_PREFIX: laruche-test
          LA_RUCHE__S3__STAGING_BUCKET: laruche-test-staging
          LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
          LA_RUCHE__AUTH__JWT_SECRET: test-secret-256-bits-minimum-for-hmac-sha256
          LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
          LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
          LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
          LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
          LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
          SQLX_OFFLINE: false
        run: cargo test --test '*'

      - name: Check (offline — .sqlx/ généré)
        env:
          SQLX_OFFLINE: true
        run: cargo check

      - name: Upload SQLx offline files
        uses: actions/upload-artifact@v7
        with:
          name: sqlx-files
          path: backend/.sqlx/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ── Tests frontend ─────────────────────────────────────────────
  test-frontend:
    name: Frontend — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Docker build ───────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_PROJECT }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=schedule,pattern=nightly
            type=schedule,pattern={{date 'YYYYMMDD'}}
            type=sha

      - name: Download SQLx offline files
        uses: actions/download-artifact@v8
        with:
          name: sqlx-files
          path: backend/.sqlx/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and pushn us
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CARGO_PROFILE=release
            SQLX_OFFLINE=true
