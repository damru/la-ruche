name: EP-009-S09 debug tests (one-shot)

# One-shot diagnostic workflow (round 5): the previous run hung on the full
# `cargo test --lib --tests` invocation. This round isolates the targets with
# hard timeouts so a hanging test is identified instead of blocking the job,
# and posts the output of each target as a PR comment, then removes itself.

on:
  push:
    branches: [vibe/ep009-s09-s10-229617]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ep009-s09-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-tests:
    name: Debug — isolated test targets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: laruche_test
          POSTGRES_USER: laruche
          POSTGRES_PASSWORD: laruche
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: backend-ci
          workspaces: |
            backend -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
          fi

      - name: Run migrations
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
        run: sqlx migrate run

      - name: Target — logbook_pdf_test (timeout 6 min)
        id: t_logbook
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: "never"
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__APP__HOST: 127.0.0.1
          LA_RUCHE__APP__PORT: "8080"
          LA_RUCHE__APP__PUBLIC_URL: http://localhost
          LA_RUCHE__APP__NAME: La Ruche CI
          LA_RUCHE__DB__URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__DB__MAX_CONNECTIONS: "5"
          LA_RUCHE__S3__ENDPOINT_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__PUBLIC_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__REGION: us-east-1
          LA_RUCHE__S3__ACCESS_KEY_ID: s3admin
          LA_RUCHE__S3__SECRET_ACCESS_KEY: s3admin
          LA_RUCHE__S3__BUCKET_PREFIX: laruche-test
          LA_RUCHE__S3__STAGING_BUCKET: laruche-test-staging
          LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
          LA_RUCHE__AUTH__JWT_SECRET: test-secret-256-bits-minimum-for-hmac-sha256
          LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
          LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
          LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
          LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
          LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
          SQLX_OFFLINE: "false"
        run: timeout 360 cargo test --test logbook_pdf_test > ../logbook-test.log 2>&1

      - name: Target — lib (timeout 5 min)
        id: t_lib
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: "never"
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__APP__HOST: 127.0.0.1
          LA_RUCHE__APP__PORT: "8080"
          LA_RUCHE__APP__PUBLIC_URL: http://localhost
          LA_RUCHE__APP__NAME: La Ruche CI
          LA_RUCHE__DB__URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__DB__MAX_CONNECTIONS: "5"
          LA_RUCHE__S3__ENDPOINT_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__PUBLIC_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__REGION: us-east-1
          LA_RUCHE__S3__ACCESS_KEY_ID: s3admin
          LA_RUCHE__S3__SECRET_ACCESS_KEY: s3admin
          LA_RUCHE__S3__BUCKET_PREFIX: laruche-test
          LA_RUCHE__S3__STAGING_BUCKET: laruche-test-staging
          LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
          LA_RUCHE__AUTH__JWT_SECRET: test-secret-256-bits-minimum-for-hmac-sha256
          LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
          LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
          LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
          LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
          LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
          SQLX_OFFLINE: "false"
        run: timeout 300 cargo test --lib > ../lib-test.log 2>&1

      - name: Target — remaining integration tests (timeout 20 min)
        id: t_rest
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: "never"
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__APP__HOST: 127.0.0.1
          LA_RUCHE__APP__PORT: "8080"
          LA_RUCHE__APP__PUBLIC_URL: http://localhost
          LA_RUCHE__APP__NAME: La Ruche CI
          LA_RUCHE__DB__URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__DB__MAX_CONNECTIONS: "5"
          LA_RUCHE__S3__ENDPOINT_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__PUBLIC_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__REGION: us-east-1
          LA_RUCHE__S3__ACCESS_KEY_ID: s3admin
          LA_RUCHE__S3__SECRET_ACCESS_KEY: s3admin
          LA_RUCHE__S3__BUCKET_PREFIX: laruche-test
          LA_RUCHE__S3__STAGING_BUCKET: laruche-test-staging
          LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
          LA_RUCHE__AUTH__JWT_SECRET: test-secret-256-bits-minimum-for-hmac-sha256
          LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
          LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
          LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
          LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
          LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
          SQLX_OFFLINE: "false"
        run: timeout 1200 cargo test --tests > ../rest-test.log 2>&1

      - name: Build report
        if: always()
        run: |
          {
            echo "### EP-009-S09 — one-shot test debug report (round 5, isolated targets)"
            echo
            echo "logbook_pdf_test: ${{ steps.t_logbook.outcome }} | lib: ${{ steps.t_lib.outcome }} | rest: ${{ steps.t_rest.outcome }}"
            echo
            echo "#### logbook_pdf_test — tail"
            echo '```'
            tail -60 ../logbook-test.log 2>/dev/null || echo "(missing)"
            echo '```'

            echo
            echo "#### lib — tail"
            echo '```'
            tail -60 ../lib-test.log 2>/dev/null || echo "(missing)"
            echo '```'

            echo
            echo "#### remaining integration tests — tail"
            echo '```'
            tail -60 ../rest-test.log 2>/dev/null || echo "(missing)"
            echo '```'

          } > "$GITHUB_WORKSPACE/debug-report.md"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'debug-report.md'),
              'utf8'
            ).slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 155,
              body
            });

      - name: Remove this one-shot workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const wfPath = '.github/workflows/ep009-s09-debug-tests.yml';
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: wfPath,
              ref: context.ref
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: wfPath,
              branch: context.ref.replace('refs/heads/', ''),
              message: 'chore(ci): remove one-shot test-debug workflow',
              sha: data.sha
            });
