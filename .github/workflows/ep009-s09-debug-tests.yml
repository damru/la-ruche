name: EP-009-S09 debug tests (one-shot)

# One-shot diagnostic workflow: runs the backend test suite exactly like the
# CI does, captures the full output and posts the failure details (panics,
# failing tests, backtraces) as a PR comment, then removes itself. This exists
# because the bot cannot download CI logs (403 without admin rights).

on:
  push:
    branches: [vibe/ep009-s09-s10-229617]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ep009-s09-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-tests:
    name: Debug — backend tests output
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: laruche_test
          POSTGRES_USER: laruche
          POSTGRES_PASSWORD: laruche
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: backend-ci
          workspaces: |
            backend -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install sqlx-cli
        run: |
          if ! command -v sqlx >/dev/null 2>&1; then
            cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked
          fi

      - name: Run migrations
        env:
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
        run: sqlx migrate run

      - name: Tests backend (captured)
        id: tests
        continue-on-error: true
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: "never"
          DATABASE_URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__APP__HOST: 127.0.0.1
          LA_RUCHE__APP__PORT: "8080"
          LA_RUCHE__APP__PUBLIC_URL: http://localhost
          LA_RUCHE__APP__NAME: La Ruche CI
          LA_RUCHE__DB__URL: postgres://laruche:laruche@localhost:5432/laruche_test
          LA_RUCHE__DB__MAX_CONNECTIONS: "5"
          LA_RUCHE__S3__ENDPOINT_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__PUBLIC_URL: http://127.0.0.1:9000
          LA_RUCHE__S3__REGION: us-east-1
          LA_RUCHE__S3__ACCESS_KEY_ID: s3admin
          LA_RUCHE__S3__SECRET_ACCESS_KEY: s3admin
          LA_RUCHE__S3__BUCKET_PREFIX: laruche-test
          LA_RUCHE__S3__STAGING_BUCKET: laruche-test-staging
          LA_RUCHE__S3__PRESIGNED_TTL_SECS: "900"
          LA_RUCHE__AUTH__JWT_SECRET: test-secret-256-bits-minimum-for-hmac-sha256
          LA_RUCHE__AUTH__ACCESS_TOKEN_TTL_SECS: "900"
          LA_RUCHE__AUTH__REFRESH_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__INVITATION_TTL_DAYS: "7"
          LA_RUCHE__AUTH__RESET_TOKEN_TTL_SECS: "3600"
          LA_RUCHE__AUTH__VENDOR_TOKEN_TTL_DAYS: "30"
          LA_RUCHE__AUTH__ARGON2_MEMORY_KB: "65536"
          LA_RUCHE__AUTH__ARGON2_ITERATIONS: "3"
          SQLX_OFFLINE: "false"
        run: cargo test --lib --tests 2>&1 | tee ../test-output.log

      - name: Build report
        if: always()
        run: |
          {
            echo "### EP-009-S09 — one-shot test debug report"
            echo
            echo "Outcome: ${{ steps.tests.outcome }}"
            echo
            echo "#### Test summaries"
            echo '```'
            grep -E "^(running [0-9]+ tests|test result:|failures:$)" ../test-output.log || echo "(no summary found)"
            echo '```'
            echo
            echo "#### Failed tests"
            echo '```'
            grep -E "^test .* \.\.\. FAILED$" ../test-output.log || echo "(none)"
            echo '```'
            echo
            echo "#### Failure details (stdout of failing tests)"
            echo '```'
            awk '/^---- .* stdout ----$/{show=1; print; next} show && /^$/{show=0; print "(end of block)"; next} show{print}' ../test-output.log | head -300 || echo "(none)"
            echo '```'
            echo
            echo "#### Panic locations (deduplicated)"
            echo '```'
            grep -h "panicked at" ../test-output.log | sort -u | head -50 || echo "(none)"
            echo '```'
            echo
            echo "#### Tail of raw output"
            echo '```'
            tail -80 ../test-output.log || true
            echo '```'
          } > "$GITHUB_WORKSPACE/debug-report.md"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(
              path.join(process.env.GITHUB_WORKSPACE, 'debug-report.md'),
              'utf8'
            ).slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 155,
              body
            });

      - name: Remove this one-shot workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const wfPath = '.github/workflows/ep009-s09-debug-tests.yml';
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: wfPath,
              ref: context.ref
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: wfPath,
              branch: context.ref.replace('refs/heads/', ''),
              message: 'chore(ci): remove one-shot test-debug workflow',
              sha: data.sha
            });
