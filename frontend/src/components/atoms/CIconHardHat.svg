
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dome — wider (x=7→17), taller (apex y≈5), brim at y=14 -->
  <path d="M7 14 A5 9 0 0 1 17 14"/>
  <!-- Brim — 2u bump beyond dome each side -->
  <line x1="5" y1="14" x2="19" y2="14"/>
  <!-- Face — 2/3 circle (240°, r≈5.77), joined to hat at y=14 -->
  <path d="M7 14 A5.77 5.77 0 1 1 17 14"/>
  <!-- Ventilation ribs — diagonal inward (converging downward) -->
  <line x1="9.5" y1="7" x2="11.5" y2="10.5"/>
  <line x1="14.5" y1="7" x2="12.5" y2="10.5"/>
</svg>
