
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dome — same width as face, apex y=7 -->
  <path d="M8 13 A4 6 0 0 1 16 13"/>
  <!-- Brim — small bump 1.5u beyond dome each side -->
  <line x1="6.5" y1="13" x2="17.5" y2="13"/>
  <!-- Half face — joined to hat at y=13, chin at y=17 -->
  <path d="M8 13 A4 4 0 0 0 16 13"/>
  <!-- Ventilation ribs — diagonal inward (converging downward) -->
  <line x1="9.5" y1="9" x2="11" y2="11.5"/>
  <line x1="14.5" y1="9" x2="13" y2="11.5"/>
</svg>
