<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wide flat dome shell -->
  <path d="M3 14 A9.5 8 0 0 1 21 14"/>
  <!-- Brim — extends 1u beyond dome each side -->
  <line x1="2" y1="14" x2="22" y2="14"/>
  <!-- Center rib: apex to brim -->
  <line x1="12" y1="6" x2="12" y2="14"/>
  <!-- Two inward-converging diagonal vents -->
  <line x1="8" y1="8.5" x2="10.5" y2="12"/>
  <line x1="16" y1="8.5" x2="13.5" y2="12"/>
</svg>
